  <style>
    #loading-screen {
      position: absolute;
      background-color: #171717;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      z-index: 100;

      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      gap: 20px;

      transition: opacity 0.5s ease;
      opacity: 1;
      color: white;
    }

    #loading-screen.hide {
      opacity: 0;
      pointer-events: none;
    }

    #loading-screen img {
      width: 200px;
      height: auto;
    }

    #loading-screen .loading-text {
      font-size: 35px;
    }

    #loading-screen .disclaimer {
      position: absolute;
      bottom: 25px;
      max-width: 90vw;
      font-size: 15px;
      text-align: center;
      white-space: pre-wrap;
      color: grey;
    }


    @media (max-width: 500px) {
      #loading-screen {
        flex-direction: column;
      }
    }
  </style>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap">
