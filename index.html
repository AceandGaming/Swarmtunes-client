<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <link rel="manifest" href="manifest.json" />

  <title>Swarmtunes</title>
  <link rel="icon" type="image/png" href="/icon.png">
  <link rel="mask-icon" sizes="180x180" href="/icon.png">
  <meta name="description" content="A music app dedicated to covers of songs made by Neuro-sama and her twin Evil">

  <link rel="canonical" href="https://swarmtunes.com/">

  <meta property="og:title" content="Swarmtunes" />
  <meta property="og:description" content="A Neuro-sama music app" />
  <meta property="og:image" content="/icon.png" />
  <meta property="og:type" content="website">

  <link rel="apple-touch-icon" sizes="180x180" href="/icon_filled.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Swarmtunes">
  <meta name="apple-mobile-web-app-status-bar-style" content="transparent">

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Swarmtunes" />
  <meta name="twitter:description" content="A music app dedicated to covers of songs made by Neuro-sama and her twin Evil" />
  <meta name="twitter:image" content="/icon.png" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Swarmtunes",
    "url": "https://swarmtunes.com",
    "description": "A fan-made Neuro-sama music app for songs, playlists, and SwarmFM."
  }
  </script>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap">

  <style>
    #loading-screen {
      position: absolute;
      background-color: #171717;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      z-index: 100;

      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      gap: 20px;

      transition: opacity 0.5s ease;
      opacity: 1;
    }

    #loading-screen.hide {
      opacity: 0;
      pointer-events: none;
    }

    #loading-screen img {
      width: 200px;
      height: auto;
    }

    #loading-screen .loading-text {
      font-size: 35px;
    }

    #loading-screen .disclaimer {
      position: absolute;
      bottom: 25px;
      max-width: 90vw;
      font-size: 15px;
      text-align: center;
      white-space: pre-wrap;
      color: grey;
    }


    @media (max-width: 500px) {
      #loading-screen {
        flex-direction: column;
      }
    }
  </style>

  <link rel="stylesheet" href="src/styles/styles.css" />
  <link rel="stylesheet" href="src/styles/content/discover.css" />
  <link rel="stylesheet" href="src/styles/content/search.css" />
  <link rel="stylesheet" href="src/styles/header.css" />
  <link rel="stylesheet" href="src/styles/now-playing.css" />
  <link rel="stylesheet" href="src/styles/song-list.css" />
  <link rel="stylesheet" href="src/styles/error-screen.css" />
  <link rel="stylesheet" href="src/styles/content/playlist-tab.css" />
  <link rel="stylesheet" href="src/styles/content/admin-panel.css" />
  <link rel="stylesheet" href="src/styles/select-playlist.css" />
  <link rel="stylesheet" href="src/styles/tabs.css" />
  <link rel="stylesheet" href="src/styles/popup.css" />
  <link rel="stylesheet" href="src/styles/toast-manager.css" />
  <script defer type="module" src="src/main.ts"></script>
</head>

<body>

  <div id="loading-screen" data-nosnippet>
    <img src="/icon.png">
    <div class="loading-text"></div>
  </div>


  <main>
    <div id="now-playing">
      <div class="title">
        <img src="/emotes/evil-cheer.webp">
        <span>Now Playing</span>
        <img src="/emotes/neuro-cheer.webp">
      </div>
    </div>
    <div id="content-container">
      <header id="header">
        <div id="header-buttons">
          <a href="/about" style="color: #aaa; text-decoration: none">About</a>
          <button title="Change Theme" id="change-theme-button">
            <img src="/icons/moon.svg" />
          </button>
          <button id="header-login-button">Log In</button>
        </div>
      </header>

      <div id="content">
        <div id="content-tabs">
          <div id="playlists-tab">
            <button id="new-playlist-button">Create Playlist</button>
            <div id="playlist-grid">

            </div>
          </div>
          <div id="discover">
            <button id="swarmfm-button" title="Play SwarmFM!" data-rightclickcategory="swarmfm"></button>
          </div>
          <div id="search">
            <input id="search-bar" type="text" placeholder="search for a song!">
            <ol id="search-results"></ol>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer id="footer"></footer>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>

</html>
